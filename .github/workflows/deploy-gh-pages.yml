name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 수동 실행도 가능하게 설정
  workflow_dispatch:

# GitHub Pages 배포 권한 설정
permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포 방지
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: |
          cd client
          npm ci

      - name: Build for GitHub Pages
        run: |
          cd client
          npm run build
        env:
          GITHUB_PAGES: 'true'
          # 환경변수 설정 (GitHub Variables 또는 직접 설정)
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://tipping-server.onrender.com/api' }}
          VITE_KAKAO_JAVASCRIPT_KEY: ${{ vars.VITE_KAKAO_JAVASCRIPT_KEY || '0060b71acbef36dda22bc99558cca8d3' }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID || '867949810382-vrf2c4o1u3rin573ikhdt5n9gv87qltj.apps.googleusercontent.com' }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './client/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
